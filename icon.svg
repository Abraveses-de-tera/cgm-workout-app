<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1f26"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#FFE57F"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#997819"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Shield/Circle Background -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="#1a1e27" stroke-width="4"/>
  
  <!-- Outer Gold Double Ring -->
  <circle cx="256" cy="256" r="235" fill="none" stroke="url(#goldGrad)" stroke-width="6" filter="url(#goldGlow)"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldBorder)" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Inner Medallion -->
  <circle cx="256" cy="256" r="165" fill="#12151c" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- Top Ribbon / Text CGM -->
  <path id="textArcTop" d="M 120 180 A 155 155 0 0 1 392 180" fill="none" />
  <text font-family="'Montserrat', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="url(#goldGrad)" letter-spacing="8">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">CGM</textPath>
  </text>

  <!-- Bottom Ribbon / Text PERFORMANCE -->
  <path id="textArcBottom" d="M 100 375 A 170 170 0 0 0 412 375" fill="none" />
  <text font-family="'Montserrat', 'Arial Black', sans-serif" font-size="22" font-weight="800" fill="url(#goldGrad)" letter-spacing="4">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">PERFORMANCE</textPath>
  </text>

  <!-- Muscle Bodybuilder Silhouette in Gold -->
  <g transform="translate(166, 175) scale(0.35)" fill="url(#goldGrad)">
    <!-- Head & Neck -->
    <circle cx="256" cy="80" r="44"/>
    <path d="M 230 115 L 282 115 L 305 160 L 207 160 Z"/>
    
    <!-- Traps & Shoulders (Delts) -->
    <path d="M 207 160 Q 150 160 110 200 Q 90 230 90 270 Q 110 290 145 280 Q 165 240 215 220 Z"/>
    <path d="M 305 160 Q 362 160 402 200 Q 422 230 422 270 Q 402 290 367 280 Q 347 240 297 220 Z"/>

    <!-- Massive Biceps / Arms Flexed -->
    <path d="M 90 270 Q 60 250 45 210 Q 55 155 100 135 Q 125 150 115 190 Q 130 200 145 280 Z"/>
    <path d="M 422 270 Q 452 250 467 210 Q 457 155 412 135 Q 387 150 397 190 Q 382 200 367 280 Z"/>
    <path d="M 45 210 Q 30 165 75 110 Q 95 125 90 150 Z"/>
    <path d="M 467 210 Q 482 165 437 110 Q 417 125 422 150 Z"/>

    <!-- Pectorals -->
    <path d="M 215 220 L 250 220 L 250 310 Q 190 310 170 260 Q 190 230 215 220 Z"/>
    <path d="M 297 220 L 262 220 L 262 310 Q 322 310 342 260 Q 322 230 297 220 Z"/>

    <!-- Lats (Wings / Espalda Amplitud) -->
    <path d="M 170 260 Q 140 330 160 410 Q 200 410 220 370 Q 200 320 200 290 Z"/>
    <path d="M 342 260 Q 372 330 352 410 Q 312 410 292 370 Q 312 320 312 290 Z"/>

    <!-- Six-pack Abs & Core -->
    <rect x="234" y="320" width="20" height="22" rx="4"/>
    <rect x="258" y="320" width="20" height="22" rx="4"/>
    <rect x="234" y="348" width="20" height="22" rx="4"/>
    <rect x="258" y="348" width="20" height="22" rx="4"/>
    <rect x="236" y="376" width="18" height="22" rx="4"/>
    <rect x="258" y="376" width="18" height="22" rx="4"/>

    <!-- Waist & Belt -->
    <path d="M 215 410 L 297 410 L 285 450 L 227 450 Z"/>
  </g>

  <!-- Stars Accent -->
  <polygon points="256,415 260,427 273,427 263,435 267,447 256,439 245,447 249,435 239,427 252,427" fill="url(#goldGrad)"/>
</svg>
